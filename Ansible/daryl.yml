---

- hosts: all
  become: true
  tasks:

  - name: Update repository index
    apt:
      update_cache: yes
    tags:
      - packages

  - name: Update programs
    apt:
      upgrade: safe
      state: latest
    tags:
      - packages

  - name: Install net-tools package
    apt:
      name: net-tools
      state: latest
    tags:
      - packages

  - name: Install tmux package
    apt:
      name: tmux
      state: latest
    tags:
      - packages

  - name: Add multiverse repository
    shell: sudo add-apt-repository multiverse
    tags:
      - packages

#  - name: Add repository non-free
#    shell: sudo apt-add-repository non-free -y

  - name: Add architecture i386
    shell: sudo dpkg --add-architecture i386
    tags:
      - packages

  - name: Install software-properties-common
    apt:
      name: software-properties-common
      force_apt_get: yes
      state: latest
    tags:
      - packages
 
  - name: Add the user pzuser
    ansible.builtin.user:
      name: pzuser
      password: $6$mysecretsalt$UxXf96m7qWf4gFJuQUWygLlhUrikalIr1qiN7P0Vz3ILP2s1EdopPgostsusBpNxETNkjpIYpr4lfwih0HmvD.
    tags:
      - users

  - name: Delete steamcmd directory if exists
    file:
      state: absent
      path: /home/pzuser/Steam
    tags:
      - steamcmd

  - name: Create steamcmd install directory
    file:
      path: /home/pzuser/steamcmd
      owner: pzuser
      group: pzuser
      state: directory
    tags:
      - steamcmd

  - name: Install steamcmd dependencies
    apt:
      name: lib32gcc-s1
      force_apt_get: yes
      state: latest
    tags:
      - steamcmd

  - name: Download steamcmd
    get_url:
      url: https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz
      dest: /home/pzuser/steamcmd/steamcmd_linux.tar.gz
      #owner: pzuser
      #group: pzuser
      #mode: '0655'
      force: yes
    tags:
      - steamcmd

  - name: Extract contents of steamcmd
    unarchive:
      src: /home/pzuser/steamcmd/steamcmd_linux.tar.gz
      dest: /home/pzuser/steamcmd/
      remote_src: yes
    tags:
      - steamcmd

  - name: Give permissions to steamcmd
    file:
      path: /home/pzuser/steamcmd
      state: directory
      recurse: yes
      owner: pzuser
      group: pzuser
      mode: '0755'
    tags:
      - steamcmd

  - name: Create server directory
    file:
      path: /opt/pzserver
      owner: pzuser
      group: pzuser
      state: directory
    tags:
      - server

  - name: Give permissions to server directory
    file:
      path: /opt/pzserver
      state: directory
      recurse: yes
      owner: pzuser
      group: pzuser
    tags:
      - server

  - name: Copy update_zomboid.txt to /home/pzuser/update_zomboid.txt
    copy:
      src: update_zomboid.txt
      dest: /home/pzuser/update_zomboid.txt
      owner: pzuser
      group: pzuser
      mode: '0755'
    tags:
      - server

  - name: Run script
    shell:
      cmd: ./steamcmd.sh +runscript /home/pzuser/update_zomboid.txt
      chdir: /home/pzuser/steamcmd/
    tags:
      - server

  - name: Allow ssh connection
    ufw:
      rule: allow
      port: 22
      proto: any
    tags:
      - ufw

  - name: Allow port 16261 udp
    ufw:
      rule: allow
      port: 16261
      proto: udp
    tags:
      - ufw

  - name: Allow port 16262 udp
    ufw:
      rule: allow
      port: 16262
      proto: udp
    tags:
      - ufw

  - name: Allow port 16262 udp
    ufw:
      rule: allow
      port: 16262
      proto: udp
    tags:
      - ufw

  - name: Allow port 8766 udp
    ufw:
      rule: allow
      port: 8766
      proto: udp
    tags:
      - ufw

  - name: Allow port 8767 udp
    ufw:
      rule: allow
      port: 8767
      proto: udp
    tags:
      - ufw

  - name: Enable firewall
    ufw:
      state: enabled
    tags:
      - ufw

  - name: Reboot firewall
    ufw:
      state: reloaded
    tags:
      - ufw

  - name: Copy workshopitems.txt to /home/pzuser/workshopitems.txt
    copy:
      src: workshopitems.txt
      dest: /home/pzuser/workshopitems.txt
      owner: pzuser
      group: pzuser
      mode: '0755'
    tags:
      - mods

  - name: Get file contents
    shell: "cat /home/pzuser/workshopitems.txt"
    register: wsi_content
    tags:
      - mods

  - name: Add my mods to server
    lineinfile:
      path: /home/pzuser/Zomboid/Server/servertest.ini
      regexp: '^WorkshopItems='
      line: WorkshopItems={{ wsi_content.stdout }}
    tags:
      - mods

  - name: Change name of server
    lineinfile:
      path: /home/pzuser/Zomboid/Server/servertest.ini
      regexp: '^PublicName='
      line: PublicName=Server JC
    tags:
      - server_name

